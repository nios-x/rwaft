# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Creates three resources: the API (a web service), the build worker (a
# background worker), and the Redis instance both share.
#
# NOTE: Render renamed managed Redis to "Key Value". If your account rejects
# `type: keyvalue`, change the two marked lines to `redis` (the older name for
# the same resource) and redeploy.
#
# Secrets are declared with `sync: false`, which makes Render prompt for them on
# first deploy instead of storing them in this file.

services:
  # ── API ──────────────────────────────────────────────────────────────────
  - type: web
    name: rwaft-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue # <- change to `redis` on older Render accounts
          name: rwaft-redis
          property: connectionString

      # Public origin of THIS service -- the API hostname the frontend talks to.
      - key: PUBLIC_BASE_URL
        value: https://rwaft.onrender.com
      # Comma-separated exact origins allowed to call this API from a browser.
      # There is no wildcard default in production: unset means every browser
      # request is refused with 403 and no Access-Control-Allow-Origin header.
      # rwaft.live is the console's domain; www redirects to it before any API
      # call, and rwaft.vercel.app stays listed while it still serves the console.
      - key: FRONTEND_ORIGIN
        value: https://rwaft.live,https://rwaft.vercel.app

      # User-facing deployments are served from <id>.rwaft.live. That
      # needs a wildcard DNS record for *.rwaft.live pointing at this
      # service AND *.rwaft.live added as a custom domain here, so Render
      # issues the wildcard certificate. The API itself stays on
      # rwaft.onrender.com.
      - key: DEPLOYMENT_DOMAIN
        value: rwaft.live
      - key: DEPLOYMENT_WILDCARD
        value: "true"

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Metered mode: Google sign-in required, 2 free credits, 1 per message.
      # Set GOOGLE_CLIENT_ID first: with PROD=true and no client ID, nobody can
      # sign in, so nobody can build. Blueprint values only apply when the
      # blueprint is synced; an existing service keeps its dashboard value.
      # ALLOW_TEST_CREDITS must never be set here.
      - key: PROD
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      # 2 free credits on sign-up, 1 per chat message: 2 free chats. A repo
      # deploy also costs 1. Failed builds are refunded automatically.
      - key: SIGNUP_TOKENS
        value: "2"
      - key: PROMPT_TOKEN_COST
        value: "1"
      - key: DEPLOY_TOKEN_COST
        value: "1"
      # Buying credits through Dodo Payments. Webhook endpoint:
      # https://rwaft.onrender.com/billing/webhook (event payment.succeeded).
      - key: DODO_PAYMENTS_API_KEY
        sync: false
      - key: DODO_PAYMENTS_WEBHOOK_KEY
        sync: false
      # live_mode with a dodo_live_ key; test_mode with a dodo_test_ key.
      - key: DODO_PAYMENTS_ENVIRONMENT
        value: live_mode
      # starter:pdt_…,builder:pdt_…,studio:pdt_… (one Dodo product per pack).
      - key: DODO_PRODUCTS
        sync: false
      # "Push to GitHub": a GitHub OAuth App whose callback URL is
      # https://rwaft.onrender.com/github/callback. Hidden until both are set.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Sign-up alerts by Gmail: GMAIL_APP_PASSWORD is an App Password, not
      # the account password. SIGNUP_ALERT_TO defaults to GMAIL_USER.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: SIGNUP_ALERT_TO
        sync: false

      # Per-hour caps per account. Credits are the real meter with PROD=true;
      # these only stop bursts. Keep PROMPT_RATE_LIMIT above SIGNUP_TOKENS, or
      # a new user is rate-limited before they can spend their free credits.
      - key: DEPLOY_RATE_LIMIT
        value: "20"
      - key: PROMPT_RATE_LIMIT
        value: "20"

  # ── Build worker ─────────────────────────────────────────────────────────
  - type: worker
    name: rwaft-worker
    runtime: docker
    # Builds are CPU- and memory-hungry; the free/starter tiers get OOM-killed
    # part way through a real npm install.
    plan: standard
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue # <- change to `redis` on older Render accounts
          name: rwaft-redis
          property: connectionString

      - key: BUILD_ROOT
        value: /tmp/rwaft-builds

      # One user build at a time. The deploy and prompt queues are pumped by two
      # concurrent loops in this process, so without this a single instance can
      # be running two npm installs and two bundlers at once.
      - key: BUILD_CONCURRENCY
        value: "1"
      # Ceiling for V8's old space in the npm/bundler children. V8 sizes its
      # heap from the HOST's RAM, not the container's cgroup limit, so an
      # uncapped Node grows past the limit and is OOM-killed rather than
      # collecting garbage. This is sized for the `standard` plan above; drop it
      # to ~256 if you run the combined image on a 512MB instance.
      - key: BUILD_HEAP_MB
        value: "1024"

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # A Gemini key is required for the /prompt flow. Every attempt goes to
      # the next configured key (round robin), and a rate-limited key sits out
      # its cooldown, so more free-tier keys means fewer stalls. Leave unused
      # ones empty.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY1
        sync: false
      - key: GEMINI_API_KEY2
        sync: false
      - key: GEMINI_API_KEY3
        sync: false
      - key: GEMINI_API_KEY4
        sync: false
      - key: GEMINI_API_KEY5
        sync: false
      - key: GEMINI_API_KEY6
        sync: false
      - key: GEMINI_API_KEY7
        sync: false
      - key: GEMINI_API_KEY8
        sync: false
      - key: AI_MODEL
        value: gemini-3.8-flash
      # Optional second provider (any OpenAI-compatible API), tried after every
      # Gemini model: a Gemini overload (503) hits every key at once. All three
      # must be set; leave them empty to stay Gemini-only.
      - key: AI_FALLBACK_BASE_URL
        sync: false
      - key: AI_FALLBACK_API_KEY
        sync: false
      - key: AI_FALLBACK_MODEL
        sync: false

      # Installing and building a real React app takes minutes. The old 60s
      # timeout killed npm mid-download, which is what corrupted node_modules.
      - key: INSTALL_TIMEOUT_MS
        value: "600000"
      - key: BUILD_TIMEOUT_MS
        value: "600000"
      - key: JOB_TIMEOUT_MS
        value: "900000"

  # ── Redis ────────────────────────────────────────────────────────────────
  - type: keyvalue # <- change to `redis` on older Render accounts
    name: rwaft-redis
    plan: starter
    # Both services reach Redis over Render's private network.
    ipAllowList: []
    # Queues and log history must survive a restart; without this Render evicts
    # keys under memory pressure and in-flight jobs disappear.
    maxmemoryPolicy: noeviction
